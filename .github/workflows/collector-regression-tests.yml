name: Collector regression tests
on:
  push:
    branches:
      - fix/site-specific-news-collection-2026-11-06
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  collector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 requests feedparser playwright sqlalchemy psycopg2-binary python-dotenv
      - name: Compile source files
        run: |
          python -m py_compile collectors/data_collector.py tests/test_collector_regressions.py check_news_collection.py
      - name: Run collector regression tests
        run: python -m unittest discover -s tests -p 'test_collector_regressions.py' -v
