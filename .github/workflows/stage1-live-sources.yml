name: Stage 1 public source live smoke (configured URLs)
on:
  push:
    branches:
      - fix/collector-isolation-tls-2026-11-18
    paths:
      - .github/workflows/stage1-live-sources.yml
  workflow_dispatch:

jobs:
  live-configured-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAX_PUBLISHING_ENABLED: "false"
      NEWS_IMAGES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector only (no ML, no database credentials)
        run: |
          python -m pip install beautifulsoup4 requests feedparser playwright sqlalchemy psycopg2-binary python-dotenv
          python -m playwright install --with-deps chromium
      - name: Live smoke of 25 configured sources, NOT local DB
        run: |
          python scripts/diagnose_all_sources.py --from-config --limit 1 --workers 3 --output collector_test_results/configured_25_live.json
      - name: Upload full per-source JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-configured-source-live-diagnostics
          path: collector_test_results/configured_25_live.json
          if-no-files-found: warn
