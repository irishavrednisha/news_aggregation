name: Stage 1 collector isolation and TLS
on:
  push:
    branches:
      - fix/collector-isolation-tls-2026-11-18
  workflow_dispatch:

jobs:
  collection-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MAX_PUBLISHING_ENABLED: "false"
      PYTHONIOENCODING: "utf-8"
      NEWS_IMAGES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight collection dependencies only (no torch/sklearn)
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 requests feedparser playwright sqlalchemy psycopg2-binary python-dotenv apscheduler
      - name: Compile modified modules
        run: |
          python -m py_compile main.py scheduler/scheduler.py collectors/data_collector.py collectors/article_quality.py collectors/tls_policy.py scripts/diagnose_all_sources.py tests/test_stage1_stability.py
      - name: Check isolated entrypoint
        run: python main.py --help
      - name: Run stage one offline contract tests
        run: python -m unittest discover -s tests -p 'test_stage1_stability.py' -v
      - name: Run existing collector regression tests
        run: python -m unittest discover -s tests -p 'test_collector_regressions.py' -v
      - name: Run all-source extraction fixtures
        run: python -m unittest discover -s tests -p 'test_text_extraction_all_sources.py' -v
      - name: Run RSS/source-specific regressions
        run: python -m unittest discover -s tests -p 'test_reactivated_sources.py' -v
      - name: Run photo extraction and safe-download regressions
        run: python -m unittest discover -s tests -p 'test_news_images.py' -v
