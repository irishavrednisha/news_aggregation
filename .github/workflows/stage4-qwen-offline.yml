name: Stage 4 Qwen offline tests

on:
  push:
    branches:
      - feat/stage4-qwen35-9b-auditable-2026-11-20
  pull_request:
    paths:
      - processing/qwen_abstractive_summary.py
      - scripts/compare_stage4_qwen.py
      - tests/test_stage4_qwen.py tests/test_stage4_qwen_postgres.py
      - tests/test_stage4_qwen_postgres.py
      - .github/workflows/stage4-qwen-offline.yml

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Stage 4 Qwen files
        run: |
          python -m py_compile processing/qwen_abstractive_summary.py scripts/compare_stage4_qwen.py tests/test_stage4_qwen.py
      - name: Run offline Qwen regression tests
        run: |
          python -m unittest discover -s tests -p "test_stage4_qwen*.py" -v
