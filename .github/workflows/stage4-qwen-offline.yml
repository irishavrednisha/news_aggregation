name: Stage 4 Qwen offline tests

on:
  push:
    branches:
      - feat/stage4-qwen35-9b-auditable-2026-11-20
      - feat/stage4-qwen-relation-audit-2026-11-20
  pull_request:
    paths:
      - processing/qwen_abstractive_summary.py
      - processing/qwen_evidence.py
      - processing/qwen_fact_guards.py
      - processing/qwen_relation_audit.py
      - processing/qwen_claim_relations.py
      - processing/qwen_language_audit.py
      - processing/qwen_semantic_reviewer.py
      - scripts/compare_stage4_qwen.py
      - scripts/revalidate_stage4_qwen.py
      - scripts/stage4_audit_once.py
      - scripts/stage4_semantic_audit.py
      - scripts/stage4_independent_holdout.py
      - tests/test_stage4_qwen.py
      - tests/test_stage4_qwen_evidence.py
      - tests/test_stage4_qwen_fact_guards.py
      - tests/test_stage4_qwen_relation_audit.py
      - tests/test_stage4_qwen_claim_relations.py
      - tests/test_stage4_qwen_semantic_reviewer.py
      - tests/test_stage4_qwen_audit_once.py
      - tests/test_stage4_independent_holdout.py
      - tests/test_stage4_qwen_postgres.py
      - .github/workflows/stage4-qwen-offline.yml

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Stage 4 Qwen files
        run: |
          python -m py_compile processing/qwen_abstractive_summary.py processing/qwen_evidence.py processing/qwen_fact_guards.py processing/qwen_relation_audit.py processing/qwen_claim_relations.py processing/qwen_language_audit.py processing/qwen_semantic_reviewer.py scripts/compare_stage4_qwen.py scripts/revalidate_stage4_qwen.py scripts/stage4_audit_once.py scripts/stage4_semantic_audit.py scripts/stage4_independent_holdout.py tests/test_stage4_independent_holdout.py tests/test_stage4_qwen.py tests/test_stage4_qwen_evidence.py tests/test_stage4_qwen_fact_guards.py tests/test_stage4_qwen_relation_audit.py tests/test_stage4_qwen_claim_relations.py tests/test_stage4_qwen_semantic_reviewer.py tests/test_stage4_qwen_audit_once.py tests/test_stage4_qwen_postgres.py
      - name: Run offline Qwen regression tests
        run: |
          python -m unittest discover -s tests -p "test_stage4_qwen*.py" -v
          python -m unittest discover -s tests -p "test_stage4_independent_holdout.py" -v
